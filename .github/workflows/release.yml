name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check src/*.zig

      - name: Run tests
        run: zig build test

      - name: Build optimized binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Smoke-test CLI
        run: ./zig-out/bin/dm help

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          cp zig-out/bin/dm package/dm
          cp README.md package/README.md
          cp LICENSE package/LICENSE

          safe_ref="${GITHUB_REF_NAME//\//-}"
          archive="dm-${safe_ref}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "dist/${archive}" -C package .
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
