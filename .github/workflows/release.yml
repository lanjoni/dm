name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig src/*.zig

      - name: Run tests
        run: zig build test

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            manifest_version="$(grep -E '^    \.version = "[^"]+",$' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')"
            test "${manifest_version}" = "${version}"
            zig build --release -Dversion="${version}"
          else
            zig build --release
          fi

      - name: Smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail

          ./zig-out/bin/dm help
          ./zig-out/bin/dm version

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist package
          cp zig-out/bin/dm package/dm
          cp README.md package/README.md
          cp LICENSE package/LICENSE

          safe_ref="${GITHUB_REF_NAME//\//-}"
          archive="dm-${safe_ref}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -czf "dist/${archive}" -C package .
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: lanjoni/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update dm formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          url="https://github.com/lanjoni/dm/archive/refs/tags/${VERSION}.tar.gz"
          sha256="$(curl -L "$url" | sha256sum | awk '{print $1}')"
          export DM_URL="$url"
          export DM_SHA256="$sha256"

          ruby -pi -e "gsub(%r{url \"https://github.com/lanjoni/dm/archive/refs/tags/.*\\.tar\\.gz\"}, 'url \"' + ENV.fetch('DM_URL') + '\"')" Formula/dm.rb
          ruby -pi -e "gsub(/sha256 \"[0-9a-f]{64}\"/, 'sha256 \"' + ENV.fetch('DM_SHA256') + '\"')" Formula/dm.rb

      - name: Commit and push tap update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dm.rb
          git commit -m "feat: update dm to ${GITHUB_REF_NAME}" || exit 0
          git push
