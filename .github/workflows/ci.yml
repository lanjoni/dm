name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Show Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check src/*.zig

      - name: Run tests
        run: zig build test

      - name: Build
        run: zig build

      - name: Smoke-test CLI
        run: ./zig-out/bin/dm help
